<style>
  :root{
    --ink:#14110F;
    --ink-2:#1E1A16;
    --paper:#F5F1E8;
    --paper-2:#ECE5D3;
    --paper-3:#E4DBC6;
    --red:#A32E28;
    --red-deep:#7A211D;
    --red-soft:#C2564F;
    --line: rgba(20,17,15,0.14);
    --line-on-dark: rgba(245,241,232,0.18);
    --muted:#5B564C;
    --muted-on-dark:#C9C2B0;
    --serif:'Newsreader', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --container: 1180px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--red);color:var(--paper);}

  h1,h2,h3,h4{
    font-family:var(--serif);
    font-weight:500;
    margin:0;
    letter-spacing:0.001em;
  }
  p{margin:0;}

  .wrap{
    max-width:var(--container);
    margin:0 auto;
    padding:0 32px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- Nav ---------- */
  header.site-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    padding:22px 0;
    transition:padding .35s ease, background .35s ease, box-shadow .35s ease, border-color .35s ease;
    border-bottom:1px solid transparent;
  }
  header.site-nav.scrolled{
    padding:14px 0;
    background:rgba(20,17,15,0.92);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-on-dark);
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand img{height:36px;width:auto;opacity:1;}
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.15;
  }
  .brand-text b{
    font-family:var(--serif);
    font-size:17px;
    font-weight:600;
    color:#fff;
    letter-spacing:0.02em;
  }
  .brand-text span{
    font-size:11px;
    color:var(--red-soft);
    letter-spacing:0.08em;
  }
  nav.links{
    display:flex;
    align-items:center;
    gap:36px;
  }
  nav.links a{
    color:#EDE7D8;
    font-size:14.5px;
    position:relative;
    padding:4px 0;
  }
  nav.links a:not(.cta)::after{
    content:'';
    position:absolute;
    left:0; right:100%;
    bottom:0;
    height:1px;
    background:var(--red-soft);
    transition:right .3s ease;
  }
  nav.links a:not(.cta):hover::after{right:0;}
  nav.links a.cta{
    border:1px solid rgba(245,241,232,0.4);
    padding:9px 20px;
    border-radius:2px;
    font-size:13.5px;
    letter-spacing:0.02em;
    transition:background .25s ease, border-color .25s ease, color .25s ease;
  }
  nav.links a.cta:hover{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .menu-btn{
    display:none;
    background:none;
    border:none;
    color:#fff;
    font-size:26px;
    cursor:pointer;
    line-height:1;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    height:100vh;
    min-height:640px;
    overflow:hidden;
    background:var(--ink);
  }
  .hero-media{
    position:absolute;
    inset:-6% -6% -6% -6%;
    will-change:transform;
  }
  .hero-slide{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation:heroCycle 21s infinite;
    filter:grayscale(28%) contrast(1.05);
  }
  .hero-slide.s1{background-image:url('img/hero-1.jpg'); animation-delay:0s;}
  .hero-slide.s2{background-image:url('img/hero-2.jpg'); animation-delay:7s;}
  .hero-slide.s3{background-image:url('img/hero-3.jpg'); animation-delay:14s;}

  @keyframes heroCycle{
    0%{opacity:0; transform:scale(1.06);}
    3%{opacity:1;}
    30%{opacity:1; transform:scale(1.14);}
    34%{opacity:0;}
    100%{opacity:0;}
  }

  .hero-scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(14,12,10,0.55) 0%, rgba(14,12,10,0.30) 32%, rgba(14,12,10,0.62) 78%, rgba(14,12,10,0.92) 100%),
      linear-gradient(90deg, rgba(14,12,10,0.55) 0%, rgba(14,12,10,0.05) 46%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding-bottom:9vh;
  }
  .hero-kicker{
    color:var(--red-soft);
    font-size:13.5px;
    letter-spacing:0.06em;
    margin-bottom:22px;
    max-width:520px;
    border-left:2px solid var(--red);
    padding-left:14px;
  }
  .hero h1{
    color:#F7F4EC;
    font-size:clamp(34px, 5.4vw, 68px);
    line-height:1.08;
    max-width:820px;
    font-weight:500;
  }
  .hero h1 em{
    font-style:italic;
    color:var(--red-soft);
    font-weight:400;
  }
  .hero-sub{
    color:#D8D2C0;
    max-width:480px;
    margin-top:26px;
    font-size:16.5px;
    line-height:1.7;
  }
  .hero-actions{
    display:flex;
    gap:16px;
    margin-top:38px;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 26px;
    font-size:14.5px;
    border-radius:2px;
    border:1px solid transparent;
    cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease, transform .2s ease;
  }
  .btn-primary{
    background:var(--red);
    color:#fff;
  }
  .btn-primary:hover{background:var(--red-deep); transform:translateY(-1px);}
  .btn-ghost{
    border-color:rgba(245,241,232,0.35);
    color:#F5F1E8;
  }
  .btn-ghost:hover{border-color:#F5F1E8; background:rgba(245,241,232,0.06);}

  .hero-scroll-cue{
    position:absolute;
    right:32px;
    bottom:36px;
    z-index:2;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted-on-dark);
    font-size:12.5px;
    letter-spacing:0.06em;
  }
  .hero-scroll-cue .line{
    width:34px; height:1px;
    background:var(--muted-on-dark);
  }
  @media (max-width:720px){ .hero-scroll-cue{display:none;} }

  /* ---------- Section basics ---------- */
  section{
    padding:118px 0;
    position:relative;
  }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:40px;
    margin-bottom:64px;
    flex-wrap:wrap;
  }
  .section-label{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--red);
    font-size:13.5px;
    letter-spacing:0.04em;
    margin-bottom:16px;
  }
  .section-label .dash{width:26px;height:1px;background:var(--red);display:inline-block;}
  .section-head h2{
    font-size:clamp(28px, 3.4vw, 44px);
    max-width:640px;
    line-height:1.18;
  }
  .section-head .lede{
    max-width:340px;
    color:var(--muted);
    font-size:15.5px;
    line-height:1.7;
    padding-bottom:4px;
  }
  .dark{background:var(--ink); color:var(--paper);}
  .dark .muted{color:var(--muted-on-dark);}
  .muted{color:var(--muted);}

  /* ---------- About ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:start;
  }
  .about-copy p{
    font-size:16.5px;
    color:var(--ink);
    line-height:1.85;
  }
  .about-copy p + p{margin-top:20px;}
  .about-copy .lang-en{
    color:var(--muted);
    font-style:italic;
    font-size:15px;
    margin-top:24px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .quote-block{
    margin-top:40px;
    padding-top:28px;
    border-top:1px solid var(--line);
  }
  .quote-block q{
    font-family:var(--serif);
    font-style:italic;
    font-size:24px;
    color:var(--ink);
    line-height:1.5;
  }
  .quote-block cite{
    display:block;
    margin-top:14px;
    font-style:normal;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .about-media{
    position:relative;
  }
  .about-media .frame{
    position:relative;
    overflow:hidden;
    border-radius:2px;
  }
  .about-media img{
    width:100%;
    height:560px;
    object-fit:cover;
    filter:grayscale(15%);
  }
  .stat-card{
    position:absolute;
    left:-40px;
    bottom:-36px;
    background:var(--ink);
    color:var(--paper);
    padding:28px 32px;
    max-width:250px;
    box-shadow:0 24px 48px rgba(20,17,15,0.22);
  }
  .stat-card .num{
    font-family:var(--serif);
    font-size:40px;
    color:var(--red-soft);
    line-height:1;
  }
  .stat-card .cap{
    font-size:13px;
    color:var(--muted-on-dark);
    margin-top:10px;
    line-height:1.5;
  }
  @media (max-width:900px){
    .about-grid{grid-template-columns:1fr; gap:56px;}
    .stat-card{left:0; bottom:-28px;}
    .about-media{margin-bottom:30px;}
  }

  /* ---------- Services (Pasal listing) ---------- */
  .services-section{background:var(--paper-2);}
  .code-columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 80px;
  }
  .code-part{margin-bottom:8px;}
  .code-part-title{
    font-family:var(--serif);
    font-size:20px;
    font-style:italic;
    color:var(--red);
    margin-bottom:6px;
  }
  .code-part-desc{
    font-size:14px;
    color:var(--muted);
    margin-bottom:28px;
    max-width:440px;
  }
  .pasal{
    display:grid;
    grid-template-columns:74px 1fr;
    gap:18px;
    padding:20px 0;
    border-top:1px solid var(--line);
  }
  .code-part:last-child .pasal:last-child{border-bottom:1px solid var(--line);}
  .pasal .num{
    font-family:var(--serif);
    font-style:italic;
    color:var(--muted);
    font-size:14px;
    padding-top:2px;
  }
  .pasal h4{
    font-family:var(--sans);
    font-weight:600;
    font-size:15.5px;
    margin-bottom:6px;
  }
  .pasal p{
    font-size:14px;
    color:var(--muted);
    line-height:1.65;
  }
  @media (max-width:900px){
    .code-columns{grid-template-columns:1fr; gap:0;}
  }

  /* ---------- Team ---------- */
  .team-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:2px;
    background:var(--line);
  }
  .team-card{
    background:var(--ink);
    padding:0 0 40px;
    position:relative;
    overflow:hidden;
  }
  .team-photo{
    position:relative;
    height:340px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 30%, rgba(163,46,40,0.35), transparent 60%),
      linear-gradient(180deg, #201A16 0%, #14110F 100%);
    overflow:hidden;
  }
  .team-photo img{
    height:100%;
    width:auto;
    object-fit:contain;
    object-position:bottom;
  }
  .team-body{padding:28px 34px 0;}
  .team-body h3{
    color:#F7F4EC;
    font-size:21px;
    margin-bottom:4px;
  }
  .team-role{
    color:var(--red-soft);
    font-size:12.5px;
    letter-spacing:0.05em;
    margin-bottom:18px;
    display:block;
  }
  .team-body p{
    color:var(--muted-on-dark);
    font-size:14px;
    line-height:1.75;
  }
  @media (max-width:900px){
    .team-grid{grid-template-columns:1fr;}
  }

  /* ---------- Engagement models ---------- */
  .model-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .model-card{
    background:var(--paper);
    padding:40px 36px;
  }
  .model-card .idx{
    font-family:var(--serif);
    font-style:italic;
    color:var(--red);
    font-size:14px;
    margin-bottom:20px;
    display:block;
  }
  .model-card h3{
    font-size:22px;
    margin-bottom:14px;
  }
  .model-card p{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.75;
  }
  .model-card .fee-tag{
    display:inline-block;
    margin-top:22px;
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--red-deep);
    border-top:1px solid var(--line);
    padding-top:16px;
    width:100%;
  }
  @media (max-width:900px){
    .model-grid{grid-template-columns:1fr;}
  }

  /* ---------- Insight / Artikel ---------- */
  .insight-section{background:var(--paper);}
  .insight-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--line);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .insight-card{
    background:var(--paper);
    padding:0 0 30px;
    display:flex;
    flex-direction:column;
    min-height:100%;
    cursor:pointer;
    transition:background .25s ease;
  }
  .insight-card:hover{background:var(--paper-2);}
  .insight-card:hover h3{color:var(--red-deep);}
  .insight-card h3{transition:color .2s ease;}
  .insight-card:focus-visible{outline:2px solid var(--red); outline-offset:-2px;}
  .insight-card-body{
    padding:26px 32px 30px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .insight-card-body h3{
    font-size:20px;
    line-height:1.35;
    margin:16px 0 14px;
  }
  .insight-card-body p{
    font-size:14px;
    color:var(--muted);
    line-height:1.7;
    flex:1;
  }
  .insight-thumb{
    position:relative;
    height:158px;
    background-color:var(--ink);
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  .insight-thumb::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,17,15,0) 55%, rgba(20,17,15,0.68) 100%);
  }
  .insight-thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
    filter:saturate(0.92);
  }
  .insight-card:hover .insight-thumb img{transform:scale(1.045);}
  .thumb-badge{
    position:absolute;
    right:14px; bottom:14px;
    z-index:2;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(20,17,15,0.72);
    border:1px solid rgba(194,86,79,0.55);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thumb-badge svg{
    width:16px;
    height:16px;
    color:var(--red-soft);
  }
  .insight-tag{
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--red);
  }
  .insight-meta{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .insight-read{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:20px;
    font-size:13px;
    color:var(--red);
    letter-spacing:0.02em;
  }
  .insight-card:hover .insight-read{gap:12px;}
  .insight-read svg{transition:transform .2s ease;}
  .insight-card:hover .insight-read svg{transform:translateX(3px);}

  /* ---------- Article modal ---------- */
  .article-modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
  }
  .article-modal.open{display:block;}
  .article-modal-backdrop{
    position:absolute;
    inset:0;
    background:rgba(15,12,10,0.72);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    opacity:0;
    transition:opacity .3s ease;
  }
  .article-modal.open .article-modal-backdrop{opacity:1;}
  .article-modal-inner{
    position:relative;
    z-index:2;
    max-width:760px;
    margin:5vh auto;
    height:90vh;
    background:var(--paper);
    box-shadow:0 30px 70px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    opacity:0;
    transform:translateY(24px) scale(0.98);
    transition:opacity .35s ease, transform .35s ease;
  }
  .article-modal.open .article-modal-inner{opacity:1; transform:none;}
  .article-modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .article-modal-head .brand-mini{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .article-modal-head .brand-mini img{height:20px; width:auto;}
  .article-close{
    background:none;
    border:1px solid var(--line);
    width:36px; height:36px;
    border-radius:50%;
    font-size:18px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
    flex-shrink:0;
  }
  .article-close:hover{background:var(--red); border-color:var(--red); color:#fff;}
  .article-modal-body{
    padding:0 48px 60px;
    overflow-y:auto;
  }
  .a-banner{
    position:relative;
    height:280px;
    margin:0 -48px 32px;
    background-color:var(--ink);
    overflow:hidden;
  }
  .a-banner img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(0.92);
  }
  .a-banner::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,17,15,0) 45%, rgba(20,17,15,0.55) 100%);
  }
  .a-banner .thumb-badge{
    width:44px; height:44px;
    right:20px; bottom:20px;
  }
  .a-banner .thumb-badge svg{width:20px; height:20px;}
  .article-modal-body .a-content{padding-top:8px;}
  .article-modal-body .a-tag{
    color:var(--red);
    font-size:13px;
    letter-spacing:0.05em;
  }
  .article-modal-body h1{
    font-size:clamp(26px, 3.4vw, 38px);
    line-height:1.22;
    margin:16px 0 18px;
  }
  .article-modal-body .a-meta{
    color:var(--muted);
    font-size:13px;
    margin-bottom:36px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  .article-modal-body p{
    font-size:16.5px;
    line-height:1.85;
    color:var(--ink);
    margin-bottom:22px;
  }
  .article-modal-body h2{
    font-size:22px;
    margin:36px 0 16px;
  }
  .article-modal-body .a-note{
    margin-top:40px;
    padding:24px 26px;
    background:var(--paper-2);
    border-left:2px solid var(--red);
    font-size:14.5px;
    color:var(--muted);
    line-height:1.75;
  }
  .article-modal-body .a-cta{
    margin-top:40px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  @media (max-width:720px){
    .article-modal-inner{margin:0; height:100vh; max-width:100%;}
    .article-modal-body{padding:0 24px 48px;}
    .a-banner{margin:0 -24px 28px; height:200px;}
  }

  .insight-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    margin-top:40px;
    padding-top:28px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .insight-foot p{
    color:var(--muted);
    font-size:14.5px;
    max-width:460px;
    line-height:1.7;
  }
  @media (max-width:900px){
    .insight-grid{grid-template-columns:1fr;}
  }

  /* ---------- Clients ---------- */
  .clients-section{
    background:var(--ink);
    color:var(--paper);
    overflow:hidden;
  }
  .client-tier{
    margin-bottom:44px;
  }
  .client-tier:last-child{margin-bottom:0;}
  .client-tier .tier-label{
    font-size:13px;
    color:var(--red-soft);
    letter-spacing:0.04em;
    margin-bottom:22px;
    display:block;
  }
  .client-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    border-top:1px solid var(--line-on-dark);
    border-left:1px solid var(--line-on-dark);
  }
  .client-list span{
    border-right:1px solid var(--line-on-dark);
    border-bottom:1px solid var(--line-on-dark);
    padding:16px 20px;
    font-size:13.5px;
    line-height:1.4;
    color:var(--muted-on-dark);
    display:flex;
    align-items:center;
    min-height:54px;
    transition:color .2s ease, background .2s ease;
  }
  .client-list span:hover{color:#fff; background:rgba(163,46,40,0.14);}

  /* ---------- Contact ---------- */
  .contact-section{
    position:relative;
    overflow:hidden;
  }
  .contact-grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:80px;
  }
  .contact-info h2{
    font-size:clamp(30px,3.6vw,46px);
    margin-bottom:26px;
    max-width:520px;
  }
  .contact-info p.lede{
    color:var(--muted);
    max-width:440px;
    font-size:16px;
    line-height:1.75;
    margin-bottom:44px;
  }
  .contact-rows{border-top:1px solid var(--line);}
  .contact-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:22px 0;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .contact-row .k{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.05em;
    min-width:120px;
  }
  .contact-row .v{
    font-size:16px;
    text-align:right;
    flex:1;
  }
  .contact-row .v a:hover{color:var(--red);}
  .contact-card{
    background:var(--ink);
    color:var(--paper);
    padding:48px 40px;
    align-self:start;
    position:relative;
  }
  .contact-card:before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--red);
  }
  .contact-card h3{
    font-size:22px;
    margin-bottom:16px;
    color:#F7F4EC;
  }
  .contact-card p{
    color:var(--muted-on-dark);
    font-size:14.5px;
    line-height:1.75;
    margin-bottom:28px;
  }
  .contact-card .mark{
    height:48px;
    margin-bottom:24px;
    opacity:1;
  }

  .contact-form{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .contact-form input,
  .contact-form select,
  .contact-form textarea{
    width:100%;
    background:rgba(245,241,232,0.05);
    border:1px solid var(--line-on-dark);
    color:var(--paper);
    font-family:var(--sans);
    font-size:14.5px;
    padding:13px 14px;
    border-radius:2px;
    transition:border-color .2s ease, background .2s ease;
  }
  .contact-form textarea{resize:vertical; min-height:96px;}
  .contact-form select{
    color:var(--paper);
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9C2B0' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:16px;
    padding-right:38px;
  }
  .contact-form select option{background:var(--ink); color:var(--paper);}
  .contact-form input::placeholder,
  .contact-form textarea::placeholder{color:var(--muted-on-dark); opacity:0.75;}
  .contact-form input:focus,
  .contact-form select:focus,
  .contact-form textarea:focus{
    outline:none;
    border-color:var(--red-soft);
    background:rgba(245,241,232,0.08);
  }
  .contact-form .hp-field{
    position:absolute;
    left:-9999px;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }
  .contact-form button[disabled]{opacity:0.6; cursor:default;}
  .form-status{
    font-size:13px;
    line-height:1.6;
    min-height:18px;
    margin:0;
  }
  .form-status.ok{color:#8FBF8A;}
  .form-status.err{color:var(--red-soft);}

  @media (max-width:900px){
    .contact-grid{grid-template-columns:1fr; gap:48px;}
  }

  /* ---------- Footer ---------- */
  footer{
    background:var(--ink);
    color:var(--muted-on-dark);
    padding:36px 0;
    border-top:1px solid var(--line-on-dark);
  }
  .footer-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    font-size:13px;
  }
  .footer-inner a:hover{color:#fff;}

  /* ---------- Reveal on scroll (single restrained effect) ---------- */
  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .reveal.in{opacity:1; transform:none;}

  /* ---------- Mobile nav ---------- */
  @media (max-width:860px){
    nav.links{
      position:fixed;
      inset:0 0 0 auto;
      width:min(320px, 82vw);
      background:var(--ink);
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      padding:40px;
      gap:26px;
      transform:translateX(100%);
      transition:transform .4s ease;
      z-index:99;
      border-left:1px solid var(--line-on-dark);
    }
    nav.links.open{transform:translateX(0);}
    nav.links a{font-size:18px;}
    .menu-btn{display:block;}
  }

  section .wrap > *:first-child{margin-top:0;}
</style>

</head>
<body>

<div id="app"></div>

<script src="content.js"></script>
<script src="render.js"></script>
<script>
  (function () {
    var root = document.getElementById("app");
    function render() {
      var content = window.AYPRender.loadContent();
      window.AYPRender.renderSite(content, root);
    }
    render();

    // Live preview from admin.html
    window.addEventListener("message", function (ev) {
      if (ev && ev.data && ev.data.type === "ayp-content") {
        window.AYPRender.renderSite(ev.data.content, root);
      }
    });
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: "ayp-ready" }, "*"); } catch (e) {}
    }
    window.addEventListener("storage", function (ev) {
      if (ev.key === "ayp_content") render();
    });
  })();
</script>

</body>
</html>
